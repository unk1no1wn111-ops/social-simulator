<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأصدقاء</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>👥 الأصدقاء</h1>
</header>

<main>

    <section class="notice">
        <h2>إضافة صديق</h2>
        <p>اكتب اسم المستخدم لإرسال طلب صداقة تجريبي.</p>

        <input
            id="friendUsername"
            type="text"
            placeholder="اسم المستخدم"
        >

        <button onclick="addFriend()">
            ➕ إضافة
        </button>
    </section>

    <section class="notice">
        <h3>أصدقاؤك</h3>
        <div id="friendsList"></div>
    </section>

    <button onclick="location.href='home.html'">
        🏠 العودة للرئيسية
    </button>

</main>

<script>

const currentUser = localStorage.getItem("currentUser");

if (!currentUser) {
    location.href = "index.html";
}

function getUsers() {
    return JSON.parse(localStorage.getItem("users") || "{}");
}

function addFriend() {

    const username =
        document.getElementById("friendUsername").value.trim();

    if (!username) {
        alert("اكتب اسم المستخدم.");
        return;
    }

    if (username === currentUser) {
        alert("لا يمكنك إضافة نفسك.");
        return;
    }

    const users = getUsers();

    if (!users[username]) {
        alert("❌ هذا المستخدم غير موجود.");
        return;
    }

    let friends =
        JSON.parse(
            localStorage.getItem("friends_" + currentUser) || "[]"
        );

    if (friends.includes(username)) {
        alert("هذا المستخدم موجود بالفعل في قائمة أصدقائك.");
        return;
    }

    friends.push(username);

    localStorage.setItem(
        "friends_" + currentUser,
        JSON.stringify(friends)
    );

    document.getElementById("friendUsername").value = "";

    alert("✅ تمت إضافة الصديق تجريبيًا.");

    loadFriends();
}

function loadFriends() {

    const friends =
        JSON.parse(
            localStorage.getItem("friends_" + currentUser) || "[]"
        );

    const list = document.getElementById("friendsList");

    if (friends.length === 0) {
        list.textContent = "لا يوجد أصدقاء بعد.";
        return;
    }

    list.innerHTML = "";

    friends.forEach(function(friend) {

        const item = document.createElement("p");

        item.textContent = "👤 @" + friend;

        list.appendChild(item);
    });
}

loadFriends();

</script>

</body>
</html>
