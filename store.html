<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المتجر</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🛒 المتجر</h1>
    <div class="balance" id="balance">$0</div>
</header>

<main>

    <section class="notice">
        <h2>متجر الخدمات</h2>
        <p>جميع الأسعار والعناصر هنا افتراضية للتجربة.</p>
    </section>

    <section class="actions">

        <button onclick="buyVerified()">
            ☑️ توثيق الحساب — $500
        </button>

        <button onclick="buyVIP()">
            ⭐ VIP — $1,000
        </button>

        <button onclick="buyFollowers()">
            👥 1,000 متابع تجريبي — $100
        </button>

        <button onclick="location.href='home.html'">
            🏠 العودة للحساب
        </button>

    </section>

</main>

<script>

const currentUser = localStorage.getItem("currentUser");

if (!currentUser) {
    window.location.href = "index.html";
}

function getUsers() {
    return JSON.parse(localStorage.getItem("users") || "{}");
}

function saveUsers(users) {
    localStorage.setItem("users", JSON.stringify(users));
}

function updateBalance() {

    const users = getUsers();
    const user = users[currentUser];

    document.getElementById("balance").textContent =
        "$" + Number(user.balance || 0).toLocaleString();
}

function buyVerified() {
    buyItem("verified", 500, "☑️ تم شراء التوثيق التجريبي.");
}

function buyVIP() {
    buyItem("vip", 1000, "⭐ تم شراء VIP التجريبي.");
}

function buyFollowers() {

    const users = getUsers();
    const user = users[currentUser];

    if (Number(user.balance || 0) < 100) {
        alert("❌ الرصيد الافتراضي غير كافٍ.");
        return;
    }

    user.balance -= 100;
    user.followers = Number(user.followers || 0) + 1000;

    saveUsers(users);

    alert("👥 تمت إضافة 1,000 متابع تجريبي.");

    updateBalance();
}

function buyItem(type, price, message) {

    const users = getUsers();
    const user = users[currentUser];

    if (Number(user.balance || 0) < price) {
        alert("❌ الرصيد الافتراضي غير كافٍ.");
        return;
    }

    user.balance -= price;

    if (!user.services) {
        user.services = {};
    }

    user.services[type] = true;

    saveUsers(users);

    alert(message);

    updateBalance();
}

updateBalance();

</script>

</body>
</html>
