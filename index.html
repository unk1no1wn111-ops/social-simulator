<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Social App</h1>
</header>

<main>

    <section class="profile">
        <div class="avatar">👤</div>

        <h2>تسجيل الدخول</h2>
        <p>ادخل إلى حسابك أو أنشئ حسابًا جديدًا</p>

        <input
            id="username"
            type="text"
            placeholder="اسم المستخدم"
            autocomplete="username"
        >

        <input
            id="password"
            type="password"
            placeholder="كلمة المرور"
            autocomplete="current-password"
        >

        <div class="actions">
            <button onclick="login()">🔐 دخول</button>
            <button onclick="register()">➕ إنشاء حساب</button>
        </div>

        <p id="message"></p>
    </section>

</main>

<script>
function showMessage(text) {
    document.getElementById("message").textContent = text;
}

function getUsers() {
    return JSON.parse(localStorage.getItem("users") || "{}");
}

function register() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    if (!username || !password) {
        showMessage("اكتب اسم المستخدم وكلمة المرور.");
        return;
    }

    const users = getUsers();

    if (users[username]) {
        showMessage("اسم المستخدم موجود بالفعل.");
        return;
    }

    users[username] = {
        username: username,
        password: password,
        balance: 0,
        followers: 0,
        posts: 0
    };

    localStorage.setItem("users", JSON.stringify(users));

    showMessage("تم إنشاء الحساب بنجاح.");
}

function login() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    const users = getUsers();

    if (!users[username] || users[username].password !== password) {
        showMessage("اسم المستخدم أو كلمة المرور غير صحيحة.");
        return;
    }

    localStorage.setItem("currentUser", username);

    window.location.href = "home.html";
}
</script>

</body>
</html>
